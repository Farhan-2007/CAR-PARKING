<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — ParkEasy</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  background: #f5f7fb;
}

.bookings-page {
  max-width: 1100px;
  margin: 45px auto;
  padding: 0 20px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.page-header h1 {
  margin: 0;
  font-size: 30px;
  color: #172033;
}

.page-header p {
  margin: 7px 0 0;
  color: #6b7280;
}

.refresh-btn {
  border: none;
  background: #2563eb;
  color: white;
  padding: 11px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 600;
}

.refresh-btn:hover {
  background: #1d4ed8;
}

.booking-card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.07);
  overflow: hidden;
}

.booking-card-header {
  padding: 20px 25px;
  border-bottom: 1px solid #e5e7eb;
}

.booking-card-header h2 {
  margin: 0;
  font-size: 19px;
  color: #172033;
}

.booking-card-header span {
  color: #6b7280;
  font-size: 14px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  padding: 15px 20px;
  background: #f8fafc;
  color: #64748b;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .4px;
}

td {
  padding: 17px 20px;
  border-top: 1px solid #eef0f4;
  color: #334155;
  font-size: 14px;
}

.booking-id {
  font-weight: 700;
  color: #2563eb;
}

.slot-number {
  font-weight: 700;
}

.amount {
  font-weight: 700;
  color: #172033;
}

.badge {
  display: inline-block;
  padding: 6px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  background: #e8f7ee;
  color: #15803d;
}
.badge.pending{background:#fef3c7;color:#b45309}
.badge.cancelled{background:#fee2e2;color:#b91c1c}

.empty-state {
  text-align: center;
  padding: 55px 20px;
  color: #64748b;
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 12px;
}

.empty-state a {
  color: #2563eb;
  font-weight: 600;
  text-decoration: none;
}

.message {
  padding: 15px 20px;
  color: #dc2626;
  text-align: center;
}

@media (max-width: 650px) {
  .bookings-page {
    margin: 25px auto;
  }

  .page-header {
    align-items: flex-start;
    gap: 15px;
    flex-direction: column;
  }

  .page-header h1 {
    font-size: 25px;
  }

  th, td {
    padding: 13px 14px;
    white-space: nowrap;
  }
}
</style>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">🅿️ ParkEasy</a>

  <nav>
    <a href="index.html" data-page="home">Home</a>
    <a href="booking.html" data-page="booking">Book a Slot</a>
    <a href="mybookings.html" data-page="mybookings">My Bookings</a>
    <a href="admin.html" data-page="admin">Admin</a>
    <span id="authArea"></span>
  </nav>
</header>

<div class="bookings-page">

  <div class="page-header">
    <div>
      <h1>My Bookings</h1>
      <p>View your parking reservations and payment history.</p>
    </div>

    <button class="refresh-btn" id="refreshBtn">
      ↻ Refresh
    </button>
  </div>

  <div class="booking-card">

    <div class="booking-card-header">
      <h2>Booking History</h2>
      <span>Your recent parking activity</span>
    </div>

    <div id="content"></div>

  </div>

</div>

<script src="app.js"></script>

<script>
requireAuth();
renderNav("mybookings");

const content = document.getElementById("content");

async function load() {

  content.innerHTML = `
    <div class="empty-state">
      Loading your bookings...
    </div>
  `;

  const { ok, data } = await apiGet("/api/mybookings");

  if (!ok) {
    content.innerHTML = `
      <div class="message">
        Could not load bookings. Please try again.
      </div>
    `;
    return;
  }

  if (data.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🅿️</div>
        <strong>No bookings yet</strong>
        <p>You haven't booked a parking slot yet.</p>
        <a href="booking.html">Book a slot →</a>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Booking</th>
            <th>Slot</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody>
          ${data.map(b => `
            <tr>
              <td>
                <span class="booking-id">#${b.id}</span>
              </td>

              <td>
                <span class="slot-number">
                  P${String(b.slot_id).padStart(2, "0")}
                </span>
              </td>

              <td>
                <span class="amount">
                  $${Number(b.amount).toFixed(2)}
                </span>
              </td>

              <td>
                <span class="badge ${b.status.toLowerCase()}">
                  ${b.status}
                </span>
              </td>

              <td>
                ${b.created_at}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

document
  .getElementById("refreshBtn")
  .addEventListener("click", load);

load();
</script>

</body>
</html>
