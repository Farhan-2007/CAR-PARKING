<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — ParkEasy</title>

<link rel="stylesheet" href="style.css">

<style>
    body {
        background: #f4f7fb;
    }

    .register-wrapper {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .register-box {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 38px;
        border-radius: 18px;
        box-shadow: 0 15px 45px rgba(20, 40, 80, 0.10);
        border: 1px solid #e5eaf2;
    }

    .register-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        background: #2875f0;
        color: white;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
    }

    .register-box h2 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 8px;
        color: #172033;
    }

    .subtitle {
        text-align: center;
        color: #718096;
        margin-bottom: 30px;
        font-size: 14px;
        line-height: 1.5;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #303b50;
    }

    .input-wrap {
        position: relative;
    }

    .input-wrap input {
        width: 100%;
        padding: 13px 45px 13px 14px;
        border: 1px solid #d8deea;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
    }

    .input-wrap input:focus {
        border-color: #2875f0;
        box-shadow: 0 0 0 3px rgba(40,117,240,0.10);
    }

    .toggle-password {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        cursor: pointer;
        font-size: 16px;
        color: #68758a;
        padding: 0;
    }

    .password-hint {
        font-size: 12px;
        color: #8a94a5;
        margin-top: 7px;
    }

    .register-btn {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 9px;
        background: #2875f0;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        transition: 0.2s;
    }

    .register-btn:hover {
        background: #1d61d0;
    }

    .msg {
        text-align: center;
        margin-top: 16px;
        font-size: 14px;
    }

    .msg.success {
        color: #198754;
    }

    .msg.error {
        color: #d43f3f;
    }

    .login-text {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #718096;
    }

    .login-text a {
        color: #2875f0;
        font-weight: bold;
        text-decoration: none;
    }

    .login-text a:hover {
        text-decoration: underline;
    }

    .security-note {
        text-align: center;
        margin-top: 22px;
        font-size: 12px;
        color: #9aa4b4;
    }

    @media (max-width: 600px) {
        .register-box {
            padding: 28px 22px;
        }
    }
</style>
</head>

<body>

<header class="nav">

    <a class="brand" href="index.html">🅿️ ParkEasy</a>

    <nav>
        <a href="index.html" data-page="home">Home</a>
        <a href="booking.html" data-page="booking">Book a Slot</a>
        <a href="mybookings.html" data-page="mybookings">My Bookings</a>
        <a href="admin.html" data-page="admin">Admin</a>
        <span id="authArea"></span>
    </nav>

</header>

<div class="register-wrapper">

    <div class="register-box">

        <div class="register-icon">👤</div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Join ParkEasy and start booking your parking slots.
        </p>

        <form id="regForm">

            <div class="field">

                <label for="u">Username</label>

                <div class="input-wrap">
                    <input
                        type="text"
                        id="u"
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        minlength="3"
                    >
                </div>

            </div>

            <div class="field">

                <label for="p">Password</label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="p"
                        placeholder="Create a password"
                        required
                        autocomplete="new-password"
                        minlength="4"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >👁️</button>

                </div>

                <div class="password-hint">
                    Use at least 4 characters.
                </div>

            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

        </form>

        <p id="m" class="msg"></p>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

        <div class="security-note">
            🔒 Your account information is securely handled.
        </div>

    </div>

</div>

<script src="app.js"></script>

<script>

renderNav("");

function togglePassword() {

    const password = document.getElementById("p");

    password.type =
        password.type === "password"
            ? "text"
            : "password";
}

document.getElementById("regForm").addEventListener("submit", async (ev) => {

    ev.preventDefault();

    const m = document.getElementById("m");

    m.textContent = "";
    m.className = "msg";

    const username =
        document.getElementById("u").value.trim();

    const password =
        document.getElementById("p").value;

    if (username.length < 3) {
        m.textContent = "Username must be at least 3 characters.";
        m.className = "msg error";
        return;
    }

    if (password.length < 4) {
        m.textContent = "Password must be at least 4 characters.";
        m.className = "msg error";
        return;
    }

    const { ok, data } = await apiPost("/api/register", {
        username: username,
        password: password
    });

    if (ok) {

        m.textContent =
            (data.message || "Registration successful.") +
            " You can now log in.";

        m.className = "msg success";

        document.getElementById("regForm").reset();

    } else {

        m.textContent =
            data.error || "Registration failed";

        m.className = "msg error";
    }

});

</script>

</body>
</html>
