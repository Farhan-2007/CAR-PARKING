<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Slot — ParkEasy</title>

<link rel="stylesheet" href="style.css">

<style>
    body {
        background: #f4f7fb;
    }

    .booking-page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 35px 20px 60px;
    }

    .booking-header {
        margin-bottom: 25px;
    }

    .booking-header h1 {
        color: #172033;
        font-size: 30px;
        margin-bottom: 7px;
    }

    .booking-header p {
        color: #718096;
    }

    /* STAT CARDS */

    .parking-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 28px;
    }

    .stat-card {
        background: white;
        border: 1px solid #e3e8f0;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 5px 20px rgba(20,40,80,0.05);
    }

    .stat-icon {
        width: 45px;
        height: 45px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }

    .blue {
        background: #e8f0ff;
    }

    .green {
        background: #e5f7ef;
    }

    .red {
        background: #fdeaea;
    }

    .stat-info strong {
        display: block;
        font-size: 22px;
        color: #172033;
    }

    .stat-info span {
        font-size: 13px;
        color: #718096;
    }

    /* MAIN CARD */

    .parking-card {
        background: white;
        border: 1px solid #e3e8f0;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(20,40,80,0.06);
    }

    .parking-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
    }

    .parking-card-header h2 {
        color: #172033;
        font-size: 21px;
    }

    .refresh-btn {
        border: 1px solid #d8deea;
        background: white;
        padding: 9px 15px;
        border-radius: 8px;
        cursor: pointer;
        color: #344054;
        font-weight: 600;
    }

    .refresh-btn:hover {
        background: #f4f7fb;
    }

    /* PARKING GRID */

    .parking-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
    }

    .slot {
        min-height: 105px;
        border-radius: 12px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: 0.2s;
        border: 2px solid transparent;
    }

    .slot.available {
        background: #e9f8f1;
        border-color: #8bd8b5;
        color: #13794e;
        cursor: pointer;
    }

    .slot.available:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 18px rgba(20,120,78,0.12);
    }

    .slot.booked {
        background: #fceaea;
        border-color: #efaaaa;
        color: #b83232;
        cursor: not-allowed;
    }

    .slot-number {
        font-size: 20px;
        font-weight: bold;
    }

    .slot-icon {
        font-size: 24px;
    }

    .slot-status {
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.5px;
    }

    /* LEGEND */

    .legend {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-top: 25px;
        color: #68758a;
        font-size: 13px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
    }

    .available-dot {
        background: #1f9d68;
    }

    .booked-dot {
        background: #d94c4c;
    }

    /* MESSAGE */

    .message {
        text-align: center;
        min-height: 22px;
        margin: 18px 0;
        font-size: 14px;
        font-weight: 500;
    }

    .success {
        color: #198754;
    }

    .error {
        color: #d43f3f;
    }

    .loading {
        color: #2875f0;
    }

    /* INFO */

    .booking-info {
        margin-top: 25px;
        padding: 17px;
        background: #f5f8fd;
        border-radius: 10px;
        color: #667085;
        font-size: 13px;
        text-align: center;
    }

    @media (max-width: 750px) {
        .parking-stats {
            grid-template-columns: 1fr;
        }

        .parking-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .parking-card {
            padding: 20px;
        }

        .parking-card-header {
            align-items: flex-start;
            gap: 10px;
        }
    }
</style>
</head>

<body>

<header class="nav">

    <a class="brand" href="index.html">🅿️ ParkEasy</a>

    <nav>
        <a href="index.html" data-page="home">Home</a>
        <a href="booking.html" data-page="booking">Book a Slot</a>
        <a href="mybookings.html" data-page="mybookings">My Bookings</a>
        <a href="admin.html" data-page="admin">Admin</a>
        <span id="authArea"></span>
    </nav>

</header>

<main class="booking-page">

    <div class="booking-header">
        <h1>Book a Parking Slot</h1>
        <p>Select an available parking slot to reserve it.</p>
    </div>

    <!-- STATISTICS -->

    <div class="parking-stats">

        <div class="stat-card">
            <div class="stat-icon blue">🅿️</div>
            <div class="stat-info">
                <strong id="totalCount">-</strong>
                <span>Total Slots</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">✓</div>
            <div class="stat-info">
                <strong id="availableCount">-</strong>
                <span>Available</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon red">🚗</div>
            <div class="stat-info">
                <strong id="occupiedCount">-</strong>
                <span>Occupied</span>
            </div>
        </div>

    </div>

    <!-- PARKING -->

    <div class="parking-card">

        <div class="parking-card-header">

            <div>
                <h2>Parking Area</h2>
            </div>

            <button id="refreshBtn" class="refresh-btn">
                ↻ Refresh
            </button>

        </div>

        <p id="m" class="message"></p>

        <div id="slots" class="parking-grid"></div>

        <div class="legend">

            <div class="legend-item">
                <span class="dot available-dot"></span>
                Available
            </div>

            <div class="legend-item">
                <span class="dot booked-dot"></span>
                Occupied
            </div>

        </div>

        <div class="booking-info">
            💡 Click on any <strong>green slot</strong> to book it.
            Payment will be processed automatically.
        </div>

    </div>

</main>

<script src="app.js"></script>

<script>

requireAuth();
renderNav("booking");

const slotsEl = document.getElementById("slots");
const msgEl = document.getElementById("m");

function setMsg(text, type = "") {

    msgEl.textContent = text;
    msgEl.className = "message " + type;
}

async function loadSlots() {

    setMsg("Loading parking slots...", "loading");

    const { ok, data } = await apiGet("/api/slots");

    if (!ok) {
        setMsg("Could not load parking slots.", "error");
        return;
    }

    const total = data.length;

    const available =
        data.filter(s => s.status === "AVAILABLE").length;

    const occupied = total - available;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("availableCount").textContent = available;
    document.getElementById("occupiedCount").textContent = occupied;

    slotsEl.innerHTML = data.map(s => {

        const isAvailable = s.status === "AVAILABLE";

        return `
            <div
                class="slot ${isAvailable ? "available" : "booked"}"
                ${isAvailable ? `onclick="bookSlot(${s.id})"` : ""}
            >

                <div class="slot-icon">
                    ${isAvailable ? "🅿️" : "🚗"}
                </div>

                <div class="slot-number">
                    P${String(s.id).padStart(2, "0")}
                </div>

                <div class="slot-status">
                    ${isAvailable ? "AVAILABLE" : "OCCUPIED"}
                </div>

            </div>
        `;

    }).join("");

    if (available > 0) {
        setMsg("Select an available slot to continue.");
    } else {
        setMsg("No parking slots are currently available.", "error");
    }
}

async function bookSlot(id) {

    setMsg(`Booking slot P${String(id).padStart(2, "0")}...`, "loading");

    const bookRes =
        await apiPost("/api/book", { slot_id: id });

    if (!bookRes.ok) {

        setMsg(
            bookRes.data.error || "Booking failed.",
            "error"
        );

        return;
    }

    setMsg("Slot reserved. Processing payment...", "loading");

    const payRes =
        await apiPost("/api/payment", {
            booking_id: bookRes.data.booking_id
        });

    if (!payRes.ok) {

        setMsg(
            payRes.data.error || "Payment failed.",
            "error"
        );

        await loadSlots();
        return;
    }

    const amount =
        Number(payRes.data.amount).toFixed(2);

    setMsg(
        `✓ Slot P${String(id).padStart(2, "0")} booked and paid successfully — $${amount}`,
        "success"
    );

    await loadSlots();
}

document
    .getElementById("refreshBtn")
    .addEventListener("click", loadSlots);

loadSlots();

</script>

</body>
</html>
